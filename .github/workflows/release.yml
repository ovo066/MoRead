name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOREAD_RELEASE_STORE_FILE: ${{ runner.temp }}/moread-release.jks
      MOREAD_RELEASE_STORE_PASSWORD: ${{ secrets.MOREAD_RELEASE_STORE_PASSWORD }}
      MOREAD_RELEASE_KEY_ALIAS: ${{ secrets.MOREAD_RELEASE_KEY_ALIAS }}
      MOREAD_RELEASE_KEY_PASSWORD: ${{ secrets.MOREAD_RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        shell: bash
        run: printf '%s' '${{ secrets.MOREAD_RELEASE_KEYSTORE_BASE64 }}' | base64 --decode > "$MOREAD_RELEASE_STORE_FILE"
      - name: Verify tag matches app version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "$VERSION_NAME" = "${GITHUB_REF_NAME#v}"
      - name: Test and build signed release
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Verify signature and prepare artifact
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mozhi-${VERSION_NAME}-vc${VERSION_CODE}.apk"
      - name: Publish GitHub Latest release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --verify-tag --generate-notes --latest --title "墨知 ${GITHUB_REF_NAME#v}"
