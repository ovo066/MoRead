<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨知 · 局域网传书</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <h1>墨知 · 局域网传书</h1>
      <p class="sub" data-en="Drop TXT / EPUB / Markdown / HTML / MOBI / AZW3 files below to send them to your phone">把 TXT / EPUB / Markdown / HTML / MOBI / AZW3 拖进下面的方框，手机会直接收下</p>
    </div>
  </header>

  <section id="drop" class="drop" tabindex="0" role="button"
           aria-label="选择或拖入书籍文件">
    <p class="drop-title">拖拽文件到这里</p>
    <p class="drop-hint">或者<span class="link">点击选择文件</span>，支持一次多选</p>
    <input id="picker" type="file" accept=".mobi,.azw,.azw3,.prc,application/x-mobipocket-ebook,application/vnd.amazon.ebook,application/vnd.amazon.mobi8-ebook,.txt,.epub,.md,.markdown,.html,.htm,.xhtml,text/plain,text/markdown,text/x-markdown,text/html,application/xhtml+xml,application/epub+zip,application/octet-stream" multiple hidden>
  </section>

  <section id="queue" class="queue" hidden></section>

  <footer class="foot">
    <p data-en="TXT / EPUB: up to 200 MB each. Markdown (.md / .markdown) and HTML (.html / .htm / .xhtml): up to 32 MiB each. DRM-free MOBI / AZW3: up to 256 MiB each.">TXT / EPUB 单个上限 200 MB；Markdown（.md / .markdown）与 HTML（.html / .htm / .xhtml）单个上限 32 MiB；无 DRM 的 MOBI / AZW3 单个上限 256 MiB。</p>
    <p class="warn">此服务没有密码：同一 Wi-Fi 下的任何人都能上传。传完请在手机上关闭。</p>
  </footer>
</main>
<script src="/app.js"></script>
</body>
</html>
