objectbox-android = { module = "io.objectbox:objectbox-android", version.ref = "objectbox" }
objectbox-java = { module = "io.objectbox:objectbox-java", version.ref = "objectbox" }
objectbox-processor = { module = "io.objectbox:objectbox-processor", version.ref = "objectbox" }
objectbox-windows = { module = "io.objectbox:objectbox-windows", version.ref = "objectbox" }
objectbox-linux = { module = "io.objectbox:objectbox-linux", version.ref = "objectbox" }
android-svg = { module = "com.caverock:androidsvg-aar", version.ref = "androidSvg" }
# 只用 core：纯 Java 编码器，把矩阵交给 Compose Canvas 自己画，不引 zxing-android-embedded
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
